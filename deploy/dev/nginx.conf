# Dev proxy: Wiki.js and the MCP server on one origin, as in production.
#   http://127.0.0.1:3090/       -> Wiki.js        (127.0.0.1:3080)
#   http://127.0.0.1:3090/mcp/   -> wikijs-mcp     (127.0.0.1:8765)
events {}
http {
  server {
    listen 127.0.0.1:3090;

    location /mcp/ {
      proxy_pass http://127.0.0.1:8765;   # no URI: the path stays /mcp/...
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_read_timeout 1h;
    }

    # OAuth metadata (WIKIJS_MCP_OAUTH=true): outside /mcp/ by RFC 8414 / RFC 9728
    location ^~ /.well-known/oauth-protected-resource/mcp/ {
      proxy_pass http://127.0.0.1:8765;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /.well-known/oauth-authorization-server/mcp/oauth {
      proxy_pass http://127.0.0.1:8765;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://127.0.0.1:3080;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
